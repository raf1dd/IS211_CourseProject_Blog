<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f7fa; color: #222; }
        .card { max-width: 400px; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .field { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 16px; background: #2c5aa0; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: #b00020; font-weight: bold; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Author Login</h1>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST" action="{{ url_for('login') }}">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Log In</button>
        </form>
        <p style="margin-top:16px;"><a href="{{ url_for('index') }}">Back to Blog</a></p>
    </div>
</body>
</html>

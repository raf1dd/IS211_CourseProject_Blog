<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }} - IS 211 Flask Blog</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 20px; background: #f5f7fa; color: #222; }
        .post { background: #fff; padding: 26px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .meta { color: #555; font-size: 0.9em; margin-bottom: 16px; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 14px; color: #2c5aa0; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="{{ url_for('index') }}">Back to Blog</a>
        {% if session.get('logged_in') %}
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
        {% endif %}
    </div>
    <article class="post">
        <h1>{{ post.title }}</h1>
        <div class="meta">
            By <strong>{{ post.author }}</strong> on {{ post.published_at }} |
            Category: <a href="{{ url_for('view_category', category_name=post.category) }}">{{ post.category }}</a>
            {% if not post.is_published %} | <strong>[Unpublished Draft]</strong>{% endif %}
        </div>
        <div>
            {{ post.content | safe }}
        </div>
    </article>
</body>
</html>
